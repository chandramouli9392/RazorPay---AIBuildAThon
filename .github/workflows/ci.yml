name: CI

on:
  push:
    branches: [main, "portfolio-upgrade/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: recovery_test
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery -d recovery_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://recovery:recovery_test_only@localhost:5432/recovery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --abort-on-container-exit --exit-code-from tests
