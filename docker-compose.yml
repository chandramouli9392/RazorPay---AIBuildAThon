services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: recovery_test
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  tests:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://recovery:recovery_test_only@postgres:5432/recovery_test
    depends_on:
      postgres:
        condition: service_healthy
